# Pytest configuration for the Niche Podcast Clipper backend.
#
# `pythonpath = .` puts the backend package root on sys.path so the tests can
# `import main`, `import core...`, `import api...`, etc. exactly the way the
# application does at runtime. Run the suite from the `backend/` directory:
#
#     pytest
#
[pytest]
testpaths = tests
# `.` puts the backend root on sys.path (`import main`, `import core...`), and
# `tests` makes the local helpers importable by name (`conftest`, `fake_redis`).
pythonpath = . tests
addopts = -q -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
